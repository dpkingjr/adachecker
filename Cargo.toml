[package]
name = "adachecker"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = { version = "0.38.0", features = ["dates"] }
eframe = { version = "0.37.0", features = ["persistence"] }
ego-tree = "0.11"
egui_extras = "0.37"
reqwest = { version = "0.13.5", features = ["blocking"] }
rfd = "0.18.0"
scraper = "0.29.0"
url = "2.5.8"
wry = "0.57.2"
zip = { version = "9.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = "0.102.0"
